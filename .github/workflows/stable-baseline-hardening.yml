name: Talibon Stable Baseline Hardening

on:
  push:
    branches:
      - main
      - KIRCH-TALIBON-STABLE-BASELINE-HARDENING-V1
      - KIRCH-TALIBON-R0-**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-baseline-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platform:
    name: Platform gate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talibon_h0_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d talibon_h0_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact hardening head
        uses: actions/checkout@v4

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$GITHUB_SHA"
          echo "Exact checkout: $ACTUAL_SHA"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, fileinfo, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Prepare isolated platform environment
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=talibon_h0_platform/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=postgres/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=postgres/' .env
          DEMO_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$DEMO_PASSWORD"
          sed -i "s/^PROTOTYPE_DEMO_PASSWORD=.*/PROTOTYPE_DEMO_PASSWORD=$DEMO_PASSWORD/" .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npm run types:check

      - name: Production frontend build
        run: npm run build

      - name: Migrate and seed isolated PostgreSQL
        run: php artisan migrate:fresh --seed --force

      - name: Run feature tests
        run: php artisan test --testsuite=Feature

      - name: Verify application routes
        run: php artisan route:list

  browser-runtime:
    name: H0 browser runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talibon_h0_browser
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d talibon_h0_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact hardening head
        uses: actions/checkout@v4

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$GITHUB_SHA"
          echo "QA_EXPECTED_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "Exact checkout: $ACTUAL_SHA"

      - name: Prepare evidence directories
        run: mkdir -p storage/app/qa storage/logs

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, fileinfo, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Prepare isolated browser environment
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          sed -i 's#^APP_URL=.*#APP_URL=http://127.0.0.1:8000#' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=talibon_h0_browser/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=postgres/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=postgres/' .env
          DEMO_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$DEMO_PASSWORD"
          sed -i "s/^PROTOTYPE_DEMO_PASSWORD=.*/PROTOTYPE_DEMO_PASSWORD=$DEMO_PASSWORD/" .env
          echo "QA_DEMO_PASSWORD=$DEMO_PASSWORD" >> "$GITHUB_ENV"
          echo "QA_BASE_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"
          echo "QA_ENVIRONMENT=github-actions-stable-baseline-hardening" >> "$GITHUB_ENV"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npm run types:check

      - name: Production frontend build
        run: npm run build

      - name: Fresh migrate and seed synthetic PostgreSQL
        run: php artisan migrate:fresh --seed --force

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start isolated Laravel runtime
        shell: bash
        run: |
          set -euo pipefail
          nohup php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/stable-baseline-hardening-server.log 2>&1 &
          echo $! > /tmp/talibon-stable-baseline-server.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat storage/logs/stable-baseline-hardening-server.log
          exit 1

      - name: H0 browser catastrophic runtime smoke
        run: node tests/Browser/h0-runtime-readiness.mjs

      - name: Upload H0 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-baseline-h0-runtime-${{ github.sha }}
          path: |
            storage/app/qa/h0-runtime-readiness-report.json
            storage/app/qa/h0-runtime-failures/**
            storage/logs/stable-baseline-hardening-server.log
          if-no-files-found: warn
          retention-days: 7

